name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show project structure
        run: find . -name "gradlew" 2>/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x project_updated/gradlew

      - name: Build Debug APK
        working-directory: project_updated
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_updated/app/build/outputs/apk/debug/app-debug.apk
